openapi: 3.1.0
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API de Resttek, plataforma de gestión de restaurantes.

    Este contrato cubre por ahora la **gestión de mesas** (issue #5) y los
    endpoints de pedidos que la usan. Todas las rutas son relativas a `/api/v1`
    (el endpoint `/health` queda fuera de este prefijo y no se documenta aquí).

    ## Formatos de error

    La API devuelve **tres** formas de error según quién lo genere:

    - `DomainError` (`{ error, message }`): errores de dominio que pasan por el
      `errorHandler` global (rutas de mesas). `error` es el nombre de la clase y
      `message` un texto en español apto para mostrar al usuario.
    - `AuthError` (`{ error }`): rechazos de los middlewares `authenticate`
      (401) y `authorize` (403). Solo tienen `error`, en inglés; la UI debe
      mostrar su propio texto para 401/403.
    - `OrderError` (`{ error }`): el controlador de pedidos gestiona sus errores
      a mano y pone el **mensaje** en `error` (sin `message`).

    ## Códigos

    - `400`: dato inválido. `401`: sin token o token inválido.
      `403`: rol sin permiso. `404`: recurso inexistente.
      `409`: conflicto de estado (número de mesa repetido, mesa no libre al
      ocuparla, borrar una mesa ocupada).

    ## Roles

    `admin`, `manager`, `camarero`, `cocinero` (empleados) y `cliente`.
servers:
  - url: /api/v1
    description: Relativa al origen del frontend (en desarrollo hace proxy de `/api` a `localhost:3000`).
tags:
  - name: Mesas
    description: Gestión de mesas de un restaurante (personal).
  - name: Mesas (cliente)
    description: Selección y ocupación de mesa por parte del cliente logueado.
  - name: Pedidos
    description: Creación y consulta de pedidos.
security:
  - bearerAuth: []

paths:
  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      summary: Listar las mesas del restaurante
      operationId: listTables
      description: |
        Devuelve todas las mesas del restaurante (cualquier estado) como array
        plano, sin paginación, ordenadas por `number` ascendente. Si el
        restaurante no existe o no tiene mesas devuelve `[]`.

        **Roles:** `admin`, `manager`, `camarero`, `cocinero`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mesas del restaurante ordenadas por número.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
              example:
                - id: table-rest-1-1
                  restaurantId: rest-1
                  number: 1
                  description: Junto a la ventana
                  capacity: 2
                  status: libre
                  createdAt: '2026-11-12T10:00:00.000Z'
                  updatedAt: '2026-11-12T10:00:00.000Z'
                - id: table-rest-1-5
                  restaurantId: rest-1
                  number: 5
                  description: null
                  capacity: 6
                  status: ocupada
                  createdAt: '2026-11-12T10:00:00.000Z'
                  updatedAt: '2026-11-12T12:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Mesas]
      summary: Crear una mesa
      operationId: createTable
      description: |
        Crea una mesa en el restaurante.

        - `number` y `capacity` deben ser **enteros JSON** mayores que 0 (un
          string como `"4"` se rechaza con 400).
        - `description` es opcional; si se omite, es `null` o es una cadena
          vacía (tras recortar espacios) se guarda `null`.
        - `status` es opcional; por defecto `libre`. Se valida igual que en
          `PATCH .../status` (admite mayúsculas y espacios alrededor).
        - El número no puede repetirse dentro del restaurante (409).
        - Si el restaurante no existe responde 404 `RestaurantNotFoundError`.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
            example:
              number: 10
              capacity: 4
              description: Terraza
      responses:
        '201':
          description: Mesa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: 6f1c2a9e-1b2c-4d3e-8f90-123456789abc
                restaurantId: rest-1
                number: 10
                description: Terraza
                capacity: 4
                status: libre
                createdAt: '2026-11-12T10:00:00.000Z'
                updatedAt: '2026-11-12T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/TableValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'

  /restaurants/{restaurantId}/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Mesas]
      summary: Obtener una mesa
      operationId: getTable
      description: |
        Devuelve la mesa. Responde 404 si no existe **o** pertenece a otro
        restaurante.

        **Roles:** `admin`, `manager`, `camarero`, `cocinero`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mesa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: table-rest-1-3
                restaurantId: rest-1
                number: 3
                description: null
                capacity: 4
                status: reservada
                createdAt: '2026-11-12T10:00:00.000Z'
                updatedAt: '2026-11-12T11:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
    put:
      tags: [Mesas]
      summary: Modificar una mesa
      operationId: updateTable
      description: |
        Reemplaza los datos de la mesa. Mismas reglas que al crear:

        - `number` y `capacity` obligatorios, enteros JSON > 0.
        - `description`: si se omite, es `null` o cadena vacía queda `null`.
        - `status` **opcional**: si se envía se valida y se aplica (el admin
          puede cambiar el estado desde el formulario); si se omite se
          conserva el estado actual.
        - El número no puede coincidir con el de **otra** mesa del mismo
          restaurante (409); conservar el propio número es válido.
        - 404 si la mesa no existe o es de otro restaurante.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
            example:
              number: 3
              capacity: 6
              description: null
              status: libre
      responses:
        '200':
          description: Mesa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: table-rest-1-3
                restaurantId: rest-1
                number: 3
                description: null
                capacity: 6
                status: libre
                createdAt: '2026-11-12T10:00:00.000Z'
                updatedAt: '2026-11-12T13:00:00.000Z'
        '400':
          $ref: '#/components/responses/TableValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'
    delete:
      tags: [Mesas]
      summary: Borrar una mesa
      operationId: deleteTable
      description: |
        Borra la mesa. No se puede borrar una mesa `ocupada` (409); las mesas
        `libre` o `reservada` sí. Respuesta 204 sin cuerpo.

        **Roles:** `admin`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Mesa borrada (sin cuerpo).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa está ocupada y no se puede borrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: TableOccupiedError
                message: No se puede borrar una mesa ocupada

  /restaurants/{restaurantId}/tables/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    patch:
      tags: [Mesas]
      summary: Cambiar el estado de una mesa
      operationId: changeTableStatus
      description: |
        Cambia el estado de la mesa. No hay máquina de estados: se permite
        cualquier transición entre `libre`, `ocupada` y `reservada` (también
        poner el mismo estado). Se normalizan mayúsculas y espacios
        (`" Reservada "` → `reservada`). Devuelve la mesa completa actualizada.

        **Roles:** `admin`, `manager`, `camarero`, `cocinero`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableStatusInput'
            example:
              status: reservada
      responses:
        '200':
          description: Estado cambiado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: table-rest-1-2
                restaurantId: rest-1
                number: 2
                description: null
                capacity: 2
                status: reservada
                createdAt: '2026-11-12T10:00:00.000Z'
                updatedAt: '2026-11-12T13:15:00.000Z'
        '400':
          description: Estado inválido o ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidTableStatusError
                message: 'Estado de mesa inválido: rota. Debe ser uno de: libre, ocupada, reservada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'

  /public/restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas (cliente)]
      summary: Listar mesas disponibles para N personas
      operationId: listAvailableTables
      description: |
        Aunque la ruta está bajo `/public`, **requiere token** (solo
        `authenticate`, sin comprobación de rol; pensada para el cliente
        logueado de `web-clientes`).

        Devuelve, como array plano de `Table`, las mesas en estado `libre` con
        `capacity >= people`, ordenadas por `capacity` ascendente y, a igual
        capacidad, por `number` ascendente. Sin resultados (o restaurante
        inexistente) devuelve `200 []`.
      security:
        - bearerAuth: []
      parameters:
        - name: people
          in: query
          required: true
          description: Número de comensales. Entero mayor que 0; si falta o no es válido, 400.
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: Mesas libres con capacidad suficiente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
              example:
                - id: table-rest-1-3
                  restaurantId: rest-1
                  number: 3
                  description: null
                  capacity: 4
                  status: libre
                  createdAt: '2026-11-12T10:00:00.000Z'
                  updatedAt: '2026-11-12T10:00:00.000Z'
                - id: table-rest-1-4
                  restaurantId: rest-1
                  number: 4
                  description: Terraza
                  capacity: 4
                  status: libre
                  createdAt: '2026-11-12T10:00:00.000Z'
                  updatedAt: '2026-11-12T10:00:00.000Z'
        '400':
          description: '`people` ausente o no es un entero mayor que 0.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidPeopleError
                message: El número de personas debe ser un entero mayor que 0
        '401':
          $ref: '#/components/responses/Unauthorized'

  /public/restaurants/{restaurantId}/tables/{id}/occupy:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Mesas (cliente)]
      summary: Ocupar una mesa libre
      operationId: occupyTable
      description: |
        Requiere token (solo `authenticate`, sin comprobación de rol). Sin
        cuerpo.

        Pasa la mesa de `libre` a `ocupada` de forma atómica
        (`UPDATE ... WHERE status = 'libre'`): si dos clientes la piden a la
        vez solo uno lo consigue y el otro recibe 409. También 409 si la mesa
        ya está `ocupada` o `reservada`. 404 si no existe o es de otro
        restaurante. Devuelve la mesa actualizada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mesa ocupada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: table-rest-1-3
                restaurantId: rest-1
                number: 3
                description: null
                capacity: 4
                status: ocupada
                createdAt: '2026-11-12T10:00:00.000Z'
                updatedAt: '2026-11-12T13:20:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa no está libre (ocupada o reservada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: TableNotAvailableError
                message: La mesa ya no está disponible

  /orders:
    post:
      tags: [Pedidos]
      summary: Crear un pedido
      operationId: createOrder
      description: |
        Crea un pedido. Requiere token (solo `authenticate`, sin comprobación
        de rol); `clientId` se toma del token.

        Cada unidad pedida se guarda como un item independiente con
        `quantity: 1` y estado `pendiente` (pedir `quantity: 2` genera dos
        items).

        `tableId` es **opcional** (puede omitirse o ser `null`) y es el **id**
        de la mesa, no su número. Si llega, la mesa debe existir, pertenecer a
        `restaurantId` y estar `ocupada`; si no, 400.

        Este controlador gestiona los errores a mano: **cualquier** error de
        validación responde 400 con `{ error: <mensaje> }` (`OrderError`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
            example:
              restaurantId: rest-1
              tableId: table-rest-1-5
              items:
                - dishId: 3b0d6c1e-0000-4000-8000-000000000001
                  quantity: 2
                  notes: Sin albahaca
      responses:
        '201':
          description: Pedido creado. Los items no incluyen datos del plato (`dishName`, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 9a8b7c6d-0000-4000-8000-0000000000aa
                restaurantId: rest-1
                tableId: table-rest-1-5
                clientId: 1c2d3e4f-0000-4000-8000-0000000000cc
                createdAt: '2026-11-12T13:30:00.000Z'
                items:
                  - id: 11111111-0000-4000-8000-000000000001
                    dishId: 3b0d6c1e-0000-4000-8000-000000000001
                    quantity: 1
                    notes: Sin albahaca
                    status: pendiente
                  - id: 11111111-0000-4000-8000-000000000002
                    dishId: 3b0d6c1e-0000-4000-8000-000000000001
                    quantity: 1
                    notes: Sin albahaca
                    status: pendiente
        '400':
          description: |
            Datos inválidos: falta `restaurantId`, `items` mal formado, o
            `tableId` de una mesa inexistente, de otro restaurante o que no
            está `ocupada`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderError'
              examples:
                mesaInexistente:
                  summary: La mesa no existe
                  value:
                    error: Mesa no encontrada
                mesaDeOtroRestaurante:
                  summary: La mesa es de otro restaurante
                  value:
                    error: La mesa no pertenece a este restaurante
                mesaNoOcupada:
                  summary: La mesa no está ocupada
                  value:
                    error: La mesa no está ocupada
                sinRestaurante:
                  summary: Falta restaurantId
                  value:
                    error: Restaurant ID is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /orders/active:
    get:
      tags: [Pedidos]
      summary: Listar pedidos activos de un restaurante
      operationId: listActiveOrders
      description: |
        Pedidos del restaurante con al menos un item no `entregado`, ordenados
        por `createdAt` ascendente. Cada pedido incluye **todos** sus items
        (también los ya entregados) con los datos del plato (`dishName`,
        `dishPrice`, `dishCategory`). No incluye `restaurantName` ni
        `restaurantLogoUrl`.

        `web-empleados` cruza pedidos y mesas en cliente con
        `order.tableId === table.id`.

        Requiere token (solo `authenticate`, sin comprobación de rol).
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          description: Id del restaurante.
          schema:
            type: string
          example: rest-1
      responses:
        '200':
          description: Pedidos activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: 9a8b7c6d-0000-4000-8000-0000000000aa
                  restaurantId: rest-1
                  tableId: table-rest-1-5
                  clientId: null
                  createdAt: '2026-11-12T13:30:00.000Z'
                  items:
                    - id: 11111111-0000-4000-8000-000000000001
                      dishId: 3b0d6c1e-0000-4000-8000-000000000001
                      quantity: 1
                      notes: null
                      status: preparando
                      dishName: Pizza Margarita
                      dishPrice: 12.5
                      dishCategory: principal
                    - id: 11111111-0000-4000-8000-000000000002
                      dishId: 3b0d6c1e-0000-4000-8000-000000000002
                      quantity: 1
                      notes: null
                      status: entregado
                      dishName: Bruschetta
                      dishPrice: 7.5
                      dishCategory: entrante
        '400':
          description: Falta el parámetro `restaurantId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderError'
              example:
                error: restaurantId is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT obtenido en `POST /auth/login`, enviado como `Authorization: Bearer <token>`.'

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Id del restaurante.
      schema:
        type: string
      example: rest-1
    TableId:
      name: id
      in: path
      required: true
      description: Id de la mesa (no su número).
      schema:
        type: string
      example: table-rest-1-3

  schemas:
    TableStatus:
      type: string
      description: |
        Estado de la mesa. `reservada` solo la pone el personal (no hay
        reservas con fecha). El cliente solo puede elegir mesas `libre`.
      enum: [libre, ocupada, reservada]
      example: libre

    Table:
      type: object
      description: Mesa de un restaurante.
      required: [id, restaurantId, number, description, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Identificador de la mesa (UUID o id fijo del seed).
          example: table-rest-1-3
        restaurantId:
          type: string
          example: rest-1
        number:
          type: integer
          minimum: 1
          description: Número visible de la mesa, único dentro del restaurante.
          example: 3
        description:
          type: [string, 'null']
          description: Descripción libre (ubicación, etc.); `null` si no tiene.
          example: Junto a la ventana
        capacity:
          type: integer
          minimum: 1
          description: Número máximo de comensales.
          example: 4
        status:
          $ref: '#/components/schemas/TableStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-12T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-12T10:00:00.000Z'

    TableInput:
      type: object
      description: |
        Cuerpo para crear (`POST`) o modificar (`PUT`) una mesa.
        `number` y `capacity` deben ser enteros JSON (no strings) mayores que 0.
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          example: 10
        capacity:
          type: integer
          minimum: 1
          example: 4
        description:
          type: [string, 'null']
          description: Opcional. Omitido, `null` o cadena vacía se guarda como `null`.
          example: Terraza
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional. En `POST` por defecto `libre`; en `PUT`, si se omite se conserva el actual.

    TableStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TableStatus'

    OrderItemStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      example: pendiente

    OrderItem:
      type: object
      description: Una unidad de un plato dentro de un pedido (siempre `quantity` 1).
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
        dishId:
          type: string
        quantity:
          type: integer
          const: 1
        notes:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrderItemStatus'
        dishName:
          type: string
          description: Solo en las consultas (no en la respuesta de creación).
        dishPrice:
          type: number
          description: Solo en las consultas (no en la respuesta de creación).
        dishCategory:
          type: string
          description: Solo en las consultas (no en la respuesta de creación).

    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableId:
          type: [string, 'null']
          description: Id de la mesa (`Table.id`, no su número) o `null` si el pedido no tiene mesa.
          example: table-rest-1-5
        clientId:
          type: [string, 'null']
          description: Id del usuario que creó el pedido.
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    CreateOrderItemInput:
      type: object
      required: [dishId, quantity]
      properties:
        dishId:
          type: string
        quantity:
          type: integer
          minimum: 1
          description: Unidades; se desglosan en items de `quantity` 1.
        notes:
          type: [string, 'null']

    CreateOrderInput:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          example: rest-1
        tableId:
          type: [string, 'null']
          description: |
            Opcional. Id de la mesa (no su número). Si llega, la mesa debe
            existir, ser de `restaurantId` y estar `ocupada`.
          example: table-rest-1-5
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItemInput'

    DomainError:
      type: object
      description: Error de dominio devuelto por el `errorHandler` global.
      required: [error, message]
      properties:
        error:
          type: string
          description: Nombre de la clase de error.
          example: TableNotFoundError
        message:
          type: string
          description: Mensaje en español apto para mostrar al usuario.
          example: Mesa no encontrada

    AuthError:
      type: object
      description: Error de los middlewares `authenticate` / `authorize` (solo `error`, en inglés).
      required: [error]
      properties:
        error:
          type: string
          example: 'Unauthorized: No token provided'

    OrderError:
      type: object
      description: Error del controlador de pedidos; `error` contiene el mensaje.
      required: [error]
      properties:
        error:
          type: string
          example: La mesa no está ocupada

  responses:
    Unauthorized:
      description: Falta el token, está mal formado o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          examples:
            sinToken:
              value:
                error: 'Unauthorized: No token provided'
            tokenInvalido:
              value:
                error: 'Unauthorized: Invalid token'
    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error: 'Forbidden: Insufficient permissions'
    TableNotFound:
      description: La mesa no existe o pertenece a otro restaurante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: TableNotFoundError
            message: Mesa no encontrada
    RestaurantNotFound:
      description: El restaurante no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: RestaurantNotFoundError
            message: Restaurant not found
    DuplicatedTableNumber:
      description: Ya existe otra mesa con ese número en el restaurante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: DuplicatedTableNumberError
            message: Ya existe una mesa con ese número en este restaurante
    TableValidationError:
      description: Datos de la mesa inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          examples:
            numeroInvalido:
              summary: Número no entero o ≤ 0
              value:
                error: InvalidTableNumberError
                message: El número de mesa debe ser un entero mayor que 0
            capacidadInvalida:
              summary: Capacidad no entera o ≤ 0
              value:
                error: InvalidCapacityError
                message: La capacidad debe ser un entero mayor que 0
            estadoInvalido:
              summary: Estado no reconocido
              value:
                error: InvalidTableStatusError
                message: 'Estado de mesa inválido: rota. Debe ser uno de: libre, ocupada, reservada'
    OrderInternalError:
      description: Error inesperado en el controlador de pedidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderError'
          example:
            error: Internal Server Error
